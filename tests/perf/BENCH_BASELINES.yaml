version: 2
purpose: historical_regression_context
policy: >-
  These are recorded repository-local development measurements. They are not
  universal performance claims and are not part of the normal CI correctness
  gate. Re-measure on the target commit/hardware before quoting them.

benchmarks:
  - name: rl_optimizer_ab_win_rate_tpch
    command: cargo test --release --test bench_optimizer -- --nocapture
    hardware: Windows-dev-laptop
    model: optimizer/model/neuralbase_optimizer.onnx
    recorded_at: 2026-03-05T04:00:00+02:00
    result:
      value: 100.0
      unit: percent_queries_model_cost_le_naive_cost
      sample: 22_tpch_join_graphs
    confidence: 0.87
    interpretation: >-
      The trained model's repository cost metric was less than or equal to the
      naive join order on 22/22 checked graphs. This is a cost-model result, not
      a wall-clock database-performance comparison.

  - name: tpch_q1_scale_0_1
    command: >-
      cargo test --release --test perf_tpch
      bench_tpch_q1_q6_records_measurements -- --nocapture --test-threads=1
    hardware: Windows-dev-laptop
    recorded_at: 2026-03-04T00:00:00+02:00
    workload: in_memory_vectorized_sf_0_1_approximately_600k_lineitem_rows
    result:
      value: 271819
      unit: us
    confidence: 0.72
    interpretation: >-
      Historical local Q1 vectorized-execution measurement. Confidence below
      0.80 means re-measurement is required before using it as a current claim.

  - name: tpch_q6_scale_0_1
    command: >-
      cargo test --release --test perf_tpch
      bench_tpch_q1_q6_records_measurements -- --nocapture --test-threads=1
    hardware: Windows-dev-laptop
    recorded_at: 2026-03-04T00:00:00+02:00
    workload: in_memory_vectorized_sf_0_1_approximately_600k_lineitem_rows
    result:
      value: 67753
      unit: us
    confidence: 0.72
    interpretation: >-
      Historical local Q6 vectorized filter/aggregate measurement. Re-measure
      before using it as current performance evidence.

missing_baseline:
  - storage_executor_rocksdb_scan
note: >-
  Current Q1/Q6 measurements exercise the in-memory vectorized path rather than
  a persistent StorageExecutor/RocksDB scan. A storage-path benchmark should be
  added before making storage-engine throughput claims.
