# SPDX-License-Identifier: Apache-2.0
# NeuralBase Secret — TLS certs + user credentials.
# In production, use sealed-secrets, external-secrets, or Vault CSI driver.
# This template contains placeholder base64 values — replace before deploy.
apiVersion: v1
kind: Secret
metadata:
  name: neuralbase-tls
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
type: Opaque
data:
  # Replace with real base64-encoded certificate and key.
  # Generate: make gen-certs && base64 -w0 certs/server.crt
  server.crt: ""
  server.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: neuralbase-users
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # users.json content — SCRAM-SHA-256 hashed passwords.
  # Generate hashes with: neuralbase CREATE USER ... WITH PASSWORD ...
  users.json: |
    {
      "require_auth": true,
      "users": []
    }
