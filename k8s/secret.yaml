# SPDX-License-Identifier: Apache-2.0
# NeuralBase Secret — TLS certs + user credentials.
# In production, use sealed-secrets, external-secrets, or Vault CSI driver.
# This template contains placeholder base64 values — replace before deploy.
apiVersion: v1
kind: Secret
metadata:
  name: neuralbase-tls
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
type: Opaque
data:
  # Replace with real base64-encoded certificate and key.
  # Provision certificates with appropriate SANs; see docs/CONFIGURATION.md.
  server.crt: ""
  server.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: neuralbase-users
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Optional legacy-migration example, NOT mounted by the raw StatefulSet.
  # Use real SCRAM records in the shape of users.json.example and authorize
  # the exact bytes with a SHA-256 digest through Helm. No CLI SQL mode exists.
  # This empty registry supplies no usable authentication account.
  users.json: |
    {
      "users": []
    }
