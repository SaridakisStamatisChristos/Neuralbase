# SPDX-License-Identifier: Apache-2.0
# NeuralBase StatefulSet — fixed 3-node development topology.
# Persistent table mutations and SCRAM identity replicate through Raft.
# This auth-disabled example does not mount a legacy registry; use Helm for
# paired read-only migration Secret + digest configuration (docs/DEPLOYMENT.md).
# Retain the legacy path so old PVC files block implicit empty-user bootstrap.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neuralbase
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
spec:
  serviceName: neuralbase-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralbase
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: neuralbase
          image: ghcr.io/saridakisstamatischristos/neuralbase:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: sql
              containerPort: 5432
            - name: raft
              containerPort: 7001
            - name: exchange
              containerPort: 8001
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: neuralbase-config
          env:
            - name: NEURALBASE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEURALBASE_PEERS
              value: "neuralbase-0=neuralbase-0.neuralbase-headless:7001,neuralbase-1=neuralbase-1.neuralbase-headless:7001,neuralbase-2=neuralbase-2.neuralbase-headless:7001"
            - name: NEURALBASE_USERS_FILE
              value: "/data/neuralbase/users.json"
          volumeMounts:
            - name: data
              mountPath: /data/neuralbase
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - "/bin/sh"
                  - "-c"
                  - "sleep 5"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
