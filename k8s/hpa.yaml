# HorizontalPodAutoscaler — scales on CPU + active_connections metric.
# NOTE: active_connections requires a Prometheus adapter or KEDA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuralbase-hpa
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: neuralbase
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: active_connections
        target:
          type: AverageValue
          averageValue: "200"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
