# SPDX-License-Identifier: Apache-2.0
# NeuralBase ConfigMap — cluster-wide configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralbase-config
  labels:
    app.kubernetes.io/name: neuralbase
    app.kubernetes.io/component: database
data:
  NEURALBASE_LISTEN_ADDR: "0.0.0.0:5432"
  NEURALBASE_RAFT_ADDR: "0.0.0.0:7001"
  NEURALBASE_METRICS_PORT: "9090"
  NEURALBASE_MAX_CONNECTIONS: "500"
  NEURALBASE_MAX_CONNECTIONS_PER_IP: "100"
  NEURALBASE_MAX_CONNECTIONS_PER_USER: "50"
  # Fresh bootstrap: create the first user on the leader, then require auth.
  # Legacy migration requires an explicit strict-SCRAM source and its digest.
  NEURALBASE_AUTH_REQUIRED: "false"
  NEURALBASE_DB_PATH: "/data/neuralbase"
