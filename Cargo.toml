[package]
name = "neuralbase"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88.0"

[features]
default = []
simd = []
# tls: enable TLS 1.3 for client and node-to-node connections.
# Requires external crates (tokio-rustls, rustls, rcgen, rustls-pemfile)
# to be added to [dependencies] and NASM or a compatible C11 compiler
# installed (for aws-lc-sys or ring assembly). See docs/THREAT_MODEL.md §2.
# To enable: `cargo build --features tls` (after adding TLS deps below).
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rcgen", "dep:rustls-pemfile"]

[dependencies]
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
sqlparser = "=0.46.0"
thiserror = "1.0.69"
rayon = "1.10.0"
num_cpus = "1.16.0"
crossbeam-deque = "0.8.6"
tract-onnx = "=0.21.7"
rocksdb = "=0.22.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
rand = "=0.8.5"
sha2       = "=0.10.8"
hmac       = "=0.12.1"
pbkdf2     = { version = "=0.12.2", default-features = false, features = ["hmac"] }
base64     = "=0.22.1"
md-5       = "=0.10.6"
hex        = "=0.4.3"

async-trait = "=0.1.88"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
metrics = "=0.24.1"
metrics-exporter-prometheus = { version = "=0.16.2", default-features = false }
# TLS deps — active (NASM 3.01 confirmed installed 2026-03-04)
tokio-rustls  = { version = "=0.26.0", optional = true }
rustls        = { version = "=0.23.4", default-features = false, features = ["ring", "tls12", "std"], optional = true }
rcgen         = { version = "=0.13.1", default-features = false, features = ["pem", "ring"], optional = true }
rustls-pemfile = { version = "=2.1.0", optional = true }

[dev-dependencies]
serde_yaml = "0.9.34"
tempfile = "=3.10.1"
proptest = "=1.4.0"
postgres = "=0.19.12"
