[package]
name = "neuralbase"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88.0"
description = "Experimental Rust SQL engine with PostgreSQL wire protocol, Raft-replicated tables and SCRAM identity, RocksDB storage, backups, and explicit read consistency"
repository = "https://github.com/SaridakisStamatisChristos/Neuralbase"
readme = "README.md"
keywords = ["database", "sql", "rust", "raft", "rocksdb"]
categories = ["database-implementations"]

[features]
default = []
simd = []
# Opt-in gate for tests/tpch_correctness.rs. That suite starts a PostgreSQL 16
# Docker reference database and therefore must not be hidden inside the generic
# unit/integration-test gate.
tpch-reference-tests = []
# tls: compile optional SQL TLS and Raft mTLS; runtime configuration enables them.
tls = ["dep:tokio-rustls", "dep:rcgen", "dep:rustls-pemfile"]

[dependencies]
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
sqlparser = "=0.46.0"
thiserror = "1.0.69"
rayon = "1.10.0"
num_cpus = "1.16.0"
crossbeam-deque = "0.8.6"
tract-onnx = "=0.21.7"
rocksdb = "=0.22.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
rand = "=0.8.5"
sha2       = "=0.10.8"
hmac       = "=0.12.1"
pbkdf2     = { version = "=0.12.2", default-features = false, features = ["hmac"] }
base64     = "=0.22.1"
md-5       = "=0.10.6"
hex        = "=0.4.3"

async-trait = "=0.1.88"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt", "json"] }
metrics = "=0.24.3"
metrics-exporter-prometheus = { version = "=0.16.2", default-features = false, features = ["http-listener"] }
# rustls is also the pinned provider facade for Phase-5 backup AEAD.
rustls        = { version = "=0.23.25", default-features = false, features = ["ring", "tls12", "std"] }
# Optional TLS transport dependencies.
tokio-rustls  = { version = "=0.26.0", optional = true }
rcgen         = { version = "=0.13.1", default-features = false, features = ["pem", "ring"], optional = true }
rustls-pemfile = { version = "=2.1.0", optional = true }

[dev-dependencies]
serde_yaml = "0.9.34"
tempfile = "=3.10.1"
proptest = "=1.4.0"
postgres = "=0.19.12"

[[test]]
name = "tpch_correctness"
path = "tests/tpch_correctness.rs"
required-features = ["tpch-reference-tests"]
