name: phase5-interruption-staging

on:
  push:
    branches:
      - phase5-interruption-staging

permissions:
  contents: write

jobs:
  interruption-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: phase5-interruption-staging
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Prepare interruption evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'interrupted_staged_backup_is_never_promoted_and_retry_is_clean' src/offline_backup.rs \
             && grep -q 'stale_restore_stages_from_multiple_crash_boundaries_are_never_resumed' src/restore.rs; then
            echo 'interruption evidence already committed; testing it directly'
          else
            python3 scripts/phase5_interruption_patch.py
          fi
          cargo fmt --all

      - name: Run interruption tests
        run: |
          cargo test --lib offline_backup::tests --locked
          cargo test --lib restore::tests --locked
          cargo test --test phase5_recovery_process --locked

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Run all-features Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit tested permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/offline_backup.rs src/restore.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/offline_backup.rs src/restore.rs
          git commit -m "Prove interrupted backup and restore boundaries"
          git push origin HEAD:phase5-interruption-staging
