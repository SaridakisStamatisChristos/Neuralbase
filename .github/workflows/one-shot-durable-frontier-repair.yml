name: one-shot-durable-frontier-repair

on:
  workflow_dispatch:
  push:
    branches: [phase11-sota-pass1]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase11-sota-pass1
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Apply durable frontier recovery repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          raft = Path('src/consensus/raft.rs')
          text = raft.read_text()
          anchor = '''    pub fn with_confirmed_apply_tx(mut self, tx: mpsc::Sender<CommittedEntry>) -> Self {\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'raft anchor count={text.count(anchor)}')
          method = '''    /// Restore the volatile Raft commit/apply frontier from a state-machine\n    /// cursor that is itself durably advanced only after committed entries apply.\n    /// This is stronger evidence than the otherwise-volatile `commit_index`: a\n    /// state machine cannot have durably applied an entry that was never committed.\n    /// The frontier must still be represented by this persisted Raft log/snapshot.\n    pub fn with_durable_apply_frontier(mut self, applied_index: u64) -> Self {\n        if applied_index < self.ps.snapshot_index {\n            panic!(\n                "fatal durable state-machine apply frontier {applied_index} is behind Raft snapshot boundary {}",\n                self.ps.snapshot_index\n            );\n        }\n        if applied_index > self.ps.last_log_index() {\n            panic!(\n                "fatal durable state-machine apply frontier {applied_index} is beyond persisted Raft log end {}",\n                self.ps.last_log_index()\n            );\n        }\n        self.commit_index = self.commit_index.max(applied_index);\n        self.last_applied = self.last_applied.max(applied_index);\n        self\n    }\n\n'''
          text = text.replace(anchor, method + anchor, 1)
          raft.write_text(text)

          main = Path('src/main.rs')
          text = main.read_text()
          old = '''    let mut node = node\n        .with_snapshot_store(snapshot_store)\n        .with_persistence(strict_store)\n        .with_confirmed_apply_tx(apply_tx);\n'''
          new = '''    // Snapshot recovery may update the SQL state machine before Raft starts.\n    // Read its durable apply cursor only after persistence/snapshot recovery and\n    // use it as proof of the previously committed prefix. This prevents a live\n    // follower restart from forgetting an already-applied frontier and waiting\n    // indefinitely for a redundant 0..N replay.\n    let mut node = node\n        .with_snapshot_store(snapshot_store)\n        .with_persistence(strict_store);\n    let durable_apply_index = state_machine\n        .durable_state()\n        .map_err(|error| {\n            io::Error::other(format!(\n                "load durable replicated SQL apply frontier: {error}"\n            ))\n        })?\n        .last_applied_index;\n    node = node\n        .with_durable_apply_frontier(durable_apply_index)\n        .with_confirmed_apply_tx(apply_tx);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'main anchor count={text.count(old)}')
          main.write_text(text.replace(old, new, 1))

          test = Path('tests/raft_durable_apply_frontier.rs')
          if test.exists():
              raise SystemExit('regression test already exists')
          test.write_text(r'''// SPDX-License-Identifier: Apache-2.0
//! Durable state-machine frontier recovery for a live-cluster follower restart.

use std::sync::atomic::Ordering;
use std::sync::Arc;
use std::time::Duration;

use neuralbase::consensus::{
    AppendEntriesArgs, ChannelTransport, ClusterMembership, MemPersistenceStore,
    PersistentState, RaftMessage, RaftNode, RaftPersistenceStore, RaftRole, Transport,
};
use tokio::sync::mpsc;

#[tokio::test]
async fn restarted_follower_recovers_applied_prefix_without_replaying_it() {
    let a = "frontier-a".to_string();
    let b = "frontier-b".to_string();
    let c = "frontier-c".to_string();
    let membership = ClusterMembership::bootstrap(a.clone(), vec![b.clone(), c.clone()]);

    // Model a retained PVC after this voter had durably applied two committed
    // entries. Raft's commit/apply counters are volatile, but the SQL state
    // machine has persisted the proof that index 2 was already committed/applied.
    let store = Arc::new(MemPersistenceStore::new());
    let mut state = PersistentState::new();
    state.current_term = 3;
    state.membership = Some(membership);
    assert_eq!(state.append(3, b"one".to_vec()), 1);
    assert_eq!(state.append(3, b"two".to_vec()), 2);
    store.save(&state, &[]).expect("seed retained Raft state");

    let bus = ChannelTransport::new_bus();
    let a_transport = Arc::new(ChannelTransport::register(a.clone(), Arc::clone(&bus)).await);
    let b_transport = Arc::new(ChannelTransport::register(b.clone(), Arc::clone(&bus)).await);
    let persistence: Arc<dyn RaftPersistenceStore> = store;
    let (apply_tx, mut apply_rx) = mpsc::channel(8);

    let mut node = RaftNode::new(a.clone(), vec![b.clone(), c], a_transport)
        .with_persistence(persistence)
        .with_durable_apply_frontier(2)
        .with_confirmed_apply_tx(apply_tx);
    node.set_election_timeout_ms(1_000);
    let readiness = node.serving_readiness();
    assert!(
        !readiness.load(Ordering::Acquire),
        "restart must remain fail-closed until a valid leader is observed"
    );

    let (_client_tx, shared, handle) = node.spawn();
    {
        let recovered = shared.lock().await;
        assert_eq!(recovered.commit_index, 2);
        assert_eq!(recovered.last_applied, 2);
        assert_eq!(recovered.role, RaftRole::Follower);
    }

    // A heartbeat from the current leader proves there is no unresolved local
    // tail. No historical state-machine replay should be necessary.
    b_transport
        .send(
            &a,
            RaftMessage::AppendEntries(AppendEntriesArgs {
                term: 4,
                leader_id: b.clone(),
                prev_log_index: 2,
                prev_log_term: 3,
                entries: vec![],
                leader_commit: 2,
            }),
        )
        .await;

    let deadline = tokio::time::Instant::now() + Duration::from_secs(1);
    while !readiness.load(Ordering::Acquire) {
        assert!(
            tokio::time::Instant::now() < deadline,
            "restarted follower never reopened readiness after leader heartbeat"
        );
        tokio::time::sleep(Duration::from_millis(5)).await;
    }

    assert!(
        tokio::time::timeout(Duration::from_millis(50), apply_rx.recv())
            .await
            .is_err(),
        "already-durable prefix was redundantly replayed"
    );
    let recovered = shared.lock().await;
    assert_eq!(recovered.role, RaftRole::Follower);
    assert_eq!(recovered.leader_id.as_deref(), Some(b.as_str()));
    assert_eq!(recovered.commit_index, 2);
    assert_eq!(recovered.last_applied, 2);
    drop(recovered);

    handle.shutdown().await;
}

#[tokio::test]
#[should_panic(expected = "beyond persisted Raft log end")]
async fn impossible_durable_frontier_fails_closed() {
    let id = "frontier-corrupt".to_string();
    let store = Arc::new(MemPersistenceStore::new());
    let mut state = PersistentState::new();
    state.membership = Some(ClusterMembership::bootstrap(id.clone(), Vec::<String>::new()));
    assert_eq!(state.append(1, b"only".to_vec()), 1);
    store.save(&state, &[]).expect("seed Raft state");

    let bus = ChannelTransport::new_bus();
    let transport = Arc::new(ChannelTransport::register(id.clone(), bus).await);
    let persistence: Arc<dyn RaftPersistenceStore> = store;
    let _ = RaftNode::new(id, vec![], transport)
        .with_persistence(persistence)
        .with_durable_apply_frontier(2);
}
''')
          PY
      - name: Format and validate
        run: |
          cargo fmt --all
          git diff --check
          git diff -- src/consensus/raft.rs src/main.rs tests/raft_durable_apply_frontier.rs
      - name: Run focused restart recovery regressions
        run: |
          cargo test --features tls --locked --test raft_durable_apply_frontier --test raft_restart_commit_recovery --test phase6_read_consistency_process
      - name: Commit verified source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/consensus/raft.rs src/main.rs tests/raft_durable_apply_frontier.rs
          git diff --cached --exit-code && { echo "No source changes to commit"; exit 1; } || true
          git commit -m "Recover Raft frontier from durable state-machine apply"
          git push origin HEAD:phase11-sota-pass1
