name: Repair rustfmt

on:
  push:
    branches:
      - repair/neuralbase-v1.1-finalization

permissions:
  contents: write

concurrency:
  group: repair-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4.2.2
        with:
          ref: repair/neuralbase-v1.1-finalization
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'rustfmt already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply rustfmt'
          git push origin HEAD:repair/neuralbase-v1.1-finalization
