name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: saridakisstamatischristos/neuralbase

jobs:
  test:
    name: Release validation
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run correctness suite
        run: make test

      - name: Run lint
        run: make lint

      - name: Check confidence boundaries
        run: make confidence

      - name: Run adversarial suite
        run: make adversarial

  manifests:
    name: Deployment manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"
      - run: helm lint helm/neuralbase
      - run: helm template neuralbase helm/neuralbase > /tmp/neuralbase.yaml
      - run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          > /tmp/neuralbase-auth.yaml
      - run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          --set auth.existingSecret=neuralbase-users
          --set-string auth.migrationSha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          > /tmp/neuralbase-identity-migration.yaml
      - name: Reject incomplete legacy identity migration
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set auth.existingSecret=neuralbase-users
          > /tmp/neuralbase-invalid-identity.yaml 2>&1
      - name: Render SQL TLS configuration
        run: >-
          helm template neuralbase helm/neuralbase
          --set tls.enabled=true
          --set tls.existingSecret=neuralbase-tls
          > /tmp/neuralbase-tls.yaml
      - name: Reject automatic scaling
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set autoscaling.enabled=true
          > /tmp/neuralbase-invalid-hpa.yaml 2>&1
      - run: test ! -e k8s/hpa.yaml

  docker:
    name: Docker build and push
    needs: [test, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm:
    name: Helm package
    needs: [test, manifests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"
      - name: Package chart
        run: helm package helm/neuralbase --destination ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: ./dist/*.tgz

  release:
    name: GitHub Release
    needs: [docker, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: ./dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./dist/*.tgz
