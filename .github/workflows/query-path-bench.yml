name: query-path-bench

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/query-path-bench.yml'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: query-path-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-base-head-characterization:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout query-path head with history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-query-path-${{ hashFiles('Cargo.lock') }}

      - name: Preserve identical query-path harness
        run: |
          mkdir -p /tmp/query-path-harness /tmp/query-path-results
          cp tests/perf_query_path.rs /tmp/query-path-harness/
          cp tests/perf_query_path_cluster.rs /tmp/query-path-harness/
          cp tests/perf_query_path_endpoint.rs /tmp/query-path-harness/
          cp tests/perf_query_path_planning.rs /tmp/query-path-harness/
          cp tests/perf_query_path_tpch_scales.rs /tmp/query-path-harness/
          cp tests/perf_query_path_memory.rs /tmp/query-path-harness/
          cp tests/perf_query_path_server_components.rs /tmp/query-path-harness/
          cp tests/cluster_recovery.rs /tmp/query-path-harness/
          cp tests/managed_membership_guards.rs /tmp/query-path-harness/
          cp tests/pitr_process.rs /tmp/query-path-harness/

      - name: Capture runner environment
        run: |
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$HEAD_SHA"
            echo "runner_os=${RUNNER_OS}"
            echo "kernel=$(uname -a)"
            echo "rustc=$(rustc --version --verbose | tr '\n' ' ')"
            echo "cpu=$(lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tr '\n' ';')"
            echo "memory=$(grep MemTotal /proc/meminfo)"
            echo "filesystem=$(df -T . | tail -1)"
          } | tee /tmp/query-path-results/environment.txt

      - name: Measure exact query-path base
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git checkout --detach "$BASE_SHA"
          cp /tmp/query-path-harness/*.rs tests/
          # Legacy PHASE10_* benchmark tokens are retained inside the historical
          # result protocol so exact-base/head datasets remain comparable.
          export PHASE10_LABEL=baseline
          export PHASE10_MEASURED_COMMIT="$BASE_SHA"
          cargo test --test perf_query_path --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-query-storage.log
          cargo test --test perf_query_path_planning --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-planning.log
          cargo test --test perf_query_path_server_components --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-server-components.log
          cargo test --test perf_query_path_cluster --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-cluster.log
          cargo test --test perf_query_path_endpoint --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-endpoint.log
          cargo test --test perf_query_path_tpch_scales --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-tpch-scales.log
          cargo test --test perf_tpch --release --locked -- bench_tpch_q1_q6_records_measurements --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/base-tpch-historical-bridge.log
          for test_name in phase10_memory_join phase10_memory_sort phase10_memory_aggregate; do
            cargo test --test perf_query_path_memory --release --locked "$test_name" -- --ignored --nocapture --test-threads=1 \
              | tee "/tmp/query-path-results/base-${test_name}.log"
          done

          scenario() {
            local name="$1"; shift
            local start end elapsed status
            start=$(date +%s%N)
            set +e
            "$@"
            status=$?
            set -e
            end=$(date +%s%N)
            elapsed=$((end-start))
            printf 'PHASE10_RESULT {"schema":1,"label":"baseline","commit":"%s","name":"%s","path":"existing_correctness_scenario","unit":"ns","warmup_iterations":0,"measured_iterations":1,"min":%s,"p50":%s,"p95":%s,"max":%s,"mean":%s,"extra":{"scenario_wall_time":true,"exit_status":%s}}\n' "$BASE_SHA" "$name" "$elapsed" "$elapsed" "$elapsed" "$elapsed" "$elapsed" "$status"
            return "$status"
          }
          {
            scenario snapshot_compaction_restart cargo test --test replicated_sql_snapshot_cycles --release --locked repeated_compaction_restart_and_suffix_replay_remain_safe -- --nocapture --test-threads=1
            scenario backup_verify_restore_fresh_generation cargo test --test cluster_recovery --release --locked restored_cluster_uses_fresh_generation_and_survives_failover_and_full_restart -- --nocapture --test-threads=1
            scenario membership_learner_catchup_promotion cargo test --test managed_membership_guards --release --locked guarded_admission_learner_restart_leader_loss_promotion_transfer_removal -- --nocapture --test-threads=1
            scenario pitr_exact_target_branch_restart cargo test --test pitr_process --release --locked process_pitr_exact_target_identity_branch_and_restart -- --nocapture --test-threads=1
          } | tee /tmp/query-path-results/base-lifecycle.log

      - name: Measure exact query-path head
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fd
          git checkout --detach "$HEAD_SHA"
          export PHASE10_LABEL=head
          export PHASE10_MEASURED_COMMIT="$HEAD_SHA"
          cargo test --test perf_query_path --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-query-storage.log
          cargo test --test perf_query_path_planning --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-planning.log
          cargo test --test perf_query_path_server_components --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-server-components.log
          cargo test --test perf_query_path_cluster --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-cluster.log
          cargo test --test perf_query_path_endpoint --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-endpoint.log
          cargo test --test perf_query_path_tpch_scales --release --locked -- --ignored --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-tpch-scales.log
          cargo test --test perf_tpch --release --locked -- bench_tpch_q1_q6_records_measurements --nocapture --test-threads=1 \
            | tee /tmp/query-path-results/head-tpch-historical-bridge.log
          for test_name in phase10_memory_join phase10_memory_sort phase10_memory_aggregate; do
            cargo test --test perf_query_path_memory --release --locked "$test_name" -- --ignored --nocapture --test-threads=1 \
              | tee "/tmp/query-path-results/head-${test_name}.log"
          done

          scenario() {
            local name="$1"; shift
            local start end elapsed status
            start=$(date +%s%N)
            set +e
            "$@"
            status=$?
            set -e
            end=$(date +%s%N)
            elapsed=$((end-start))
            printf 'PHASE10_RESULT {"schema":1,"label":"head","commit":"%s","name":"%s","path":"existing_correctness_scenario","unit":"ns","warmup_iterations":0,"measured_iterations":1,"min":%s,"p50":%s,"p95":%s,"max":%s,"mean":%s,"extra":{"scenario_wall_time":true,"exit_status":%s}}\n' "$HEAD_SHA" "$name" "$elapsed" "$elapsed" "$elapsed" "$elapsed" "$elapsed" "$status"
            return "$status"
          }
          {
            scenario snapshot_compaction_restart cargo test --test replicated_sql_snapshot_cycles --release --locked repeated_compaction_restart_and_suffix_replay_remain_safe -- --nocapture --test-threads=1
            scenario backup_verify_restore_fresh_generation cargo test --test cluster_recovery --release --locked restored_cluster_uses_fresh_generation_and_survives_failover_and_full_restart -- --nocapture --test-threads=1
            scenario membership_learner_catchup_promotion cargo test --test managed_membership_guards --release --locked guarded_admission_learner_restart_leader_loss_promotion_transfer_removal -- --nocapture --test-threads=1
            scenario pitr_exact_target_branch_restart cargo test --test pitr_process --release --locked process_pitr_exact_target_identity_branch_and_restart -- --nocapture --test-threads=1
          } | tee /tmp/query-path-results/head-lifecycle.log

      - name: Extract machine-readable results
        if: always()
        shell: bash
        run: |
          grep -h '^PHASE10_RESULT ' /tmp/query-path-results/*.log 2>/dev/null \
            | sed 's/^PHASE10_RESULT //' \
            > /tmp/query-path-results/results.jsonl || true
          cat /tmp/query-path-results/results.jsonl || true

      - name: Upload query-path characterization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-path-exact-base-head-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: /tmp/query-path-results
          if-no-files-found: error
          retention-days: 30
