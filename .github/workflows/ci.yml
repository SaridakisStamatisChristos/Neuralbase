name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run core tests
        run: timeout --signal=TERM --kill-after=30s 30m make test

      - name: Run lint
        run: make lint

      - name: Check confidence artifacts
        run: make confidence

      - name: Run adversarial tests
        run: make adversarial

      - name: Create operator test Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: neuralbase-phase7
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          wait: 120s

      - name: Run guarded Kubernetes membership lifecycle
        run: |
          mkdir -p /tmp/neuralbase-phase7-image
          cp target/debug/neuralbase target/debug/neuralbase-operator /tmp/neuralbase-phase7-image/
          docker build -f ops/Dockerfile.operator-test -t neuralbase:phase7 /tmp/neuralbase-phase7-image
          kind load docker-image neuralbase:phase7 --name neuralbase-phase7
          kubectl --context kind-neuralbase-phase7 create namespace neuralbase-phase7
          timeout --signal=TERM --kill-after=30s 15m python3 tests/phase7_kubernetes.py

      - name: Dump operator deployment diagnostics
        if: failure()
        run: |
          kubectl --context kind-neuralbase-phase7 -n neuralbase-phase7 get pods,statefulsets,pvc -o wide || true
          kubectl --context kind-neuralbase-phase7 -n neuralbase-phase7 get events --sort-by=.lastTimestamp || true

      - name: Clean operator test cluster
        if: always()
        run: kind delete cluster --name neuralbase-phase7 || true

  tpch-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run PostgreSQL 16 TPC-H reference suite
        run: timeout --signal=TERM --kill-after=30s 20m make tpch-correctness

      - name: Dump PostgreSQL reference logs on failure
        if: failure()
        run: docker logs neuralbase-pg16-ref || true

      - name: Clean PostgreSQL reference container
        if: always()
        run: docker rm -f neuralbase-pg16-ref || true

  deployment-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Lint Helm chart
        run: helm lint helm/neuralbase

      - name: Render default Helm chart
        run: helm template neuralbase helm/neuralbase > /tmp/neuralbase-rendered.yaml

      - name: Render auth-required existing-identity chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          > /tmp/neuralbase-auth-rendered.yaml

      - name: Render legacy identity migration chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          --set auth.existingSecret=neuralbase-users
          --set-string auth.migrationSha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          > /tmp/neuralbase-identity-migration-rendered.yaml

      - name: Reject incomplete legacy identity migration config
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set auth.existingSecret=neuralbase-users
          > /tmp/neuralbase-invalid-identity-rendered.yaml 2>&1

      - name: Render TLS Helm chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set tls.enabled=true
          --set tls.existingSecret=neuralbase-tls
          > /tmp/neuralbase-tls-rendered.yaml

      - name: Reject unsafe HPA manifest
        run: test ! -e k8s/hpa.yaml

      - name: Reject automatic Helm scaling
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set autoscaling.enabled=true
          > /tmp/neuralbase-invalid-hpa-rendered.yaml 2>&1
