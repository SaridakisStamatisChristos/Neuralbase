name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run core tests
        run: timeout --signal=TERM --kill-after=30s 30m make test

      - name: Run lint
        run: make lint

      - name: Check confidence artifacts
        run: make confidence

      - name: Run adversarial tests
        run: make adversarial

      - name: Create operator test Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: neuralbase-phase7
          version: v0.29.0
          node_image: kindest/node:v1.33.1
          wait: 120s

      - name: Run guarded Kubernetes membership lifecycle
        run: |
          mkdir -p /tmp/neuralbase-phase7-image
          cp target/debug/neuralbase target/debug/neuralbase-operator /tmp/neuralbase-phase7-image/
          docker build -f ops/Dockerfile.operator-test -t neuralbase:phase7 /tmp/neuralbase-phase7-image
          kind load docker-image neuralbase:phase7 --name neuralbase-phase7
          kubectl --context kind-neuralbase-phase7 create namespace neuralbase-phase7
          timeout --signal=TERM --kill-after=30s 15m python3 tests/phase7_kubernetes.py

      - name: Dump operator deployment diagnostics
        if: failure()
        run: |
          kubectl --context kind-neuralbase-phase7 -n neuralbase-phase7 get pods,statefulsets,pvc -o wide || true
          kubectl --context kind-neuralbase-phase7 -n neuralbase-phase7 get events --sort-by=.lastTimestamp || true

      - name: Clean operator test cluster
        if: always()
        run: kind delete cluster --name neuralbase-phase7 || true

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage reports
        run: timeout --signal=TERM --kill-after=30s 45m make coverage

      - name: Publish coverage summary
        id: coverage-summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("coverage/llvm-summary.json")
          payload = json.loads(source.read_text())
          totals = payload["data"][0]["totals"]

          def stat(name):
              item = totals[name]
              return {
                  "count": item["count"],
                  "covered": item["covered"],
                  "percent": round(float(item["percent"]), 2),
              }

          summary = {
              "schema": 1,
              "commit": os.environ["GITHUB_SHA"],
              "scope": "cargo test --features tls --tests --locked; source files only",
              "lines": stat("lines"),
              "functions": stat("functions"),
              "regions": stat("regions"),
          }
          Path("coverage/coverage-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )

          lines = summary["lines"]["percent"]
          functions = summary["functions"]["percent"]
          regions = summary["regions"]["percent"]

          Path("coverage/coverage.txt").write_text(
              f"line_coverage={lines:.2f}%\n"
              f"function_coverage={functions:.2f}%\n"
              f"region_coverage={regions:.2f}%\n"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"lines={lines:.2f}\n")
              out.write(f"functions={functions:.2f}\n")
              out.write(f"regions={regions:.2f}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Rust coverage\n\n")
              out.write("| Metric | Coverage | Covered / Total |\n")
              out.write("| --- | ---: | ---: |\n")
              for key, label in (
                  ("lines", "Lines"),
                  ("functions", "Functions"),
                  ("regions", "Regions"),
              ):
                  value = summary[key]
                  out.write(
                      f"| {label} | **{value['percent']:.2f}%** | "
                      f"{value['covered']} / {value['count']} |\n"
                  )
              out.write("\nScope: `cargo test --features tls --tests --locked`; ")
              out.write("test/benchmark source files are excluded from the reported denominator.\n")

          print(f"Line coverage: {lines:.2f}%")
          print(f"Function coverage: {functions:.2f}%")
          print(f"Region coverage: {regions:.2f}%")
          PY

      - name: Upload standard coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/coverage.xml
            coverage/lcov.info
            coverage/llvm-summary.json
            coverage/coverage-summary.json
            coverage/coverage.txt
            coverage/html/
          if-no-files-found: error
          retention-days: 30
  tpch-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "Disk after cleanup:"
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run PostgreSQL 16 TPC-H reference suite
        run: timeout --signal=TERM --kill-after=30s 20m make tpch-correctness

      - name: Dump PostgreSQL reference logs on failure
        if: failure()
        run: docker logs neuralbase-pg16-ref || true

      - name: Clean PostgreSQL reference container
        if: always()
        run: docker rm -f neuralbase-pg16-ref || true

  deployment-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Lint Helm chart
        run: helm lint helm/neuralbase

      - name: Render default Helm chart
        run: helm template neuralbase helm/neuralbase > /tmp/neuralbase-rendered.yaml

      - name: Render auth-required existing-identity chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          > /tmp/neuralbase-auth-rendered.yaml

      - name: Render legacy identity migration chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set config.authRequired=true
          --set auth.existingSecret=neuralbase-users
          --set-string auth.migrationSha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          > /tmp/neuralbase-identity-migration-rendered.yaml

      - name: Reject incomplete legacy identity migration config
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set auth.existingSecret=neuralbase-users
          > /tmp/neuralbase-invalid-identity-rendered.yaml 2>&1

      - name: Render TLS Helm chart
        run: >-
          helm template neuralbase helm/neuralbase
          --set tls.enabled=true
          --set tls.existingSecret=neuralbase-tls
          > /tmp/neuralbase-tls-rendered.yaml

      - name: Reject unsafe HPA manifest
        run: test ! -e k8s/hpa.yaml

      - name: Reject automatic Helm scaling
        run: >-
          ! helm template neuralbase helm/neuralbase
          --set autoscaling.enabled=true
          > /tmp/neuralbase-invalid-hpa-rendered.yaml 2>&1
