name: phase3-s13-removal-fix

on:
  push:
    branches:
      - fix/phase3-s13-removal-test

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase3-s13-removal-test
      - name: Stabilize non-leader removal test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/raft_correctness.rs')
          s = p.read_text()
          old = '''    let (reply_tx, reply_rx) = oneshot::channel::<Result<u64, String>>();
    cmd_txs[leader_idx]
        .send(ClientCommand {
            payload: encode_membership_change(&MembershipChange::RemoveNode("ms_r2".to_string())),
            reply: reply_tx,
        })
'''
          new = '''    let remove_idx = (0..ids.len())
        .find(|&i| i != leader_idx)
        .expect("3-node cluster must have a non-leader voter");
    let remove_id = ids[remove_idx].to_string();

    let (reply_tx, reply_rx) = oneshot::channel::<Result<u64, String>>();
    cmd_txs[leader_idx]
        .send(ClientCommand {
            payload: encode_membership_change(&MembershipChange::RemoveNode(remove_id.clone())),
            reply: reply_tx,
        })
'''
          if old not in s:
              raise SystemExit('expected S13 removal snippet not found')
          s = s.replace(old, new, 1)
          old_assert = '''    assert!(
        result.is_ok(),
        "RemoveNode must be accepted by leader: {result:?}"
    );
'''
          new_assert = '''    assert!(
        result.is_ok(),
        "RemoveNode for non-leader voter {remove_id} must be accepted by leader: {result:?}"
    );
'''
          if old_assert not in s:
              raise SystemExit('expected S13 removal assertion not found')
          s = s.replace(old_assert, new_assert, 1)
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit focused test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-s13-removal-fix.yml
          git add tests/raft_correctness.rs
          git commit -m "Stabilize S13 non-leader removal test"
          git push origin HEAD:fix/phase3-s13-removal-test
