name: phase3-s13-removal-fix

on:
  push:
    branches:
      - fix/phase3-s13-removal-test

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/phase3-s13-removal-test
      - name: Stabilize non-leader removal test
        run: >-
          python3 -c 'from pathlib import Path; p=Path("tests/raft_correctness.rs"); s=p.read_text(); fn=s.index("async fn s13_removenode_membership_change_3node()"); reply="    let (reply_tx, reply_rx) = oneshot::channel::<Result<u64, String>>();\n"; pos=s.index(reply, fn); insertion="    let remove_idx = (0..ids.len())\n        .find(|&i| i != leader_idx)\n        .expect(\"3-node cluster must have a non-leader voter\");\n    let remove_id = ids[remove_idx].to_string();\n\n"; s=s[:pos]+insertion+s[pos:]; s=s.replace("MembershipChange::RemoveNode(\"ms_r2\".to_string())", "MembershipChange::RemoveNode(remove_id.clone())", 1); s=s.replace("RemoveNode must be accepted by leader: {result:?}", "RemoveNode for non-leader voter {remove_id} must be accepted by leader: {result:?}", 1); p.write_text(s)'
      - name: Format
        run: cargo fmt --all
      - name: Commit focused test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-s13-removal-fix.yml
          git add tests/raft_correctness.rs
          git commit -m "Stabilize S13 non-leader removal test"
          git push origin HEAD:fix/phase3-s13-removal-test
