name: one-shot-raft-incarnation

on:
  push:
    branches:
      - phase11-sota-pass1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase11-sota-pass1
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply Raft transport incarnation repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/consensus/transport.rs")
          text = p.read_text()

          text = text.replace(
              "use std::collections::HashMap;",
              "use std::collections::{HashMap, HashSet};",
              1,
          )

          anchor = """const PEER_RETRY_BACKOFF: Duration = Duration::from_millis(25);\n\n"""
          addition = """const PEER_RETRY_BACKOFF: Duration = Duration::from_millis(25);\n\ntype WireEnvelope = (NodeId, u64, RaftMessage);\n\n#[derive(Default)]\nstruct PeerIncarnations {\n    current: HashMap<NodeId, u64>,\n    retired: HashMap<NodeId, HashSet<u64>>,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum PeerIncarnationObservation {\n    First,\n    Current,\n    Replaced,\n    Retired,\n}\n\nimpl PeerIncarnations {\n    fn observe(&mut self, peer: &NodeId, incarnation: u64) -> PeerIncarnationObservation {\n        let Some(current) = self.current.get(peer).copied() else {\n            self.current.insert(peer.clone(), incarnation);\n            return PeerIncarnationObservation::First;\n        };\n        if current == incarnation {\n            return PeerIncarnationObservation::Current;\n        }\n        if self\n            .retired\n            .get(peer)\n            .is_some_and(|retired| retired.contains(&incarnation))\n        {\n            return PeerIncarnationObservation::Retired;\n        }\n        self.retired\n            .entry(peer.clone())\n            .or_default()\n            .insert(current);\n        self.current.insert(peer.clone(), incarnation);\n        PeerIncarnationObservation::Replaced\n    }\n}\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f"constant anchor count={text.count(anchor)}")
          text = text.replace(anchor, addition, 1)

          old_fields = """    rx: Arc<Mutex<mpsc::Receiver<(NodeId, RaftMessage)>>>,\n    writers: Arc<Mutex<HashMap<NodeId, mpsc::Sender<RaftMessage>>>>,\n    shutdown_tx: Option<oneshot::Sender<()>>,\n"""
          new_fields = """    rx: Arc<Mutex<mpsc::Receiver<(NodeId, RaftMessage)>>>,\n    writers: Arc<Mutex<HashMap<NodeId, mpsc::Sender<RaftMessage>>>>,\n    incarnation: u64,\n    peer_incarnations: Arc<Mutex<PeerIncarnations>>,\n    shutdown_tx: Option<oneshot::Sender<()>>,\n"""
          if text.count(old_fields) != 2:
              raise SystemExit(f"transport field anchor count={text.count(old_fields)}")
          text = text.replace(old_fields, new_fields, 2)

          old_tcp_setup = """        let (shutdown_tx, mut shutdown_rx) = oneshot::channel::<()>();\n        let tx_clone = tx.clone();\n        let accept_task = tokio::spawn(async move {\n"""
          new_tcp_setup = """        let (shutdown_tx, mut shutdown_rx) = oneshot::channel::<()>();\n        let tx_clone = tx.clone();\n        let writers = Arc::new(Mutex::new(HashMap::new()));\n        let peer_incarnations = Arc::new(Mutex::new(PeerIncarnations::default()));\n        let accept_writers = Arc::clone(&writers);\n        let accept_peer_incarnations = Arc::clone(&peer_incarnations);\n        let accept_task = tokio::spawn(async move {\n"""
          if text.count(old_tcp_setup) != 1:
              raise SystemExit(f"tcp setup anchor count={text.count(old_tcp_setup)}")
          text = text.replace(old_tcp_setup, new_tcp_setup, 1)

          old_tcp_accept = """                                let tx2 = tx_clone.clone();\n                                tokio::spawn(Self::accept_conn(stream, tx2));\n"""
          new_tcp_accept = """                                let tx2 = tx_clone.clone();\n                                let writers2 = Arc::clone(&accept_writers);\n                                let incarnations2 = Arc::clone(&accept_peer_incarnations);\n                                tokio::spawn(Self::accept_conn(stream, tx2, writers2, incarnations2));\n"""
          if text.count(old_tcp_accept) != 1:
              raise SystemExit(f"tcp accept anchor count={text.count(old_tcp_accept)}")
          text = text.replace(old_tcp_accept, new_tcp_accept, 1)

          old_tcp_init = """            rx: Arc::new(Mutex::new(rx)),\n            writers: Arc::new(Mutex::new(HashMap::new())),\n            shutdown_tx: Some(shutdown_tx),\n"""
          new_tcp_init = """            rx: Arc::new(Mutex::new(rx)),\n            writers,\n            incarnation: rand::random::<u64>(),\n            peer_incarnations,\n            shutdown_tx: Some(shutdown_tx),\n"""
          if text.count(old_tcp_init) != 1:
              raise SystemExit(f"tcp init anchor count={text.count(old_tcp_init)}")
          text = text.replace(old_tcp_init, new_tcp_init, 1)

          old_accept_conn = """    async fn accept_conn(mut stream: TcpStream, tx: mpsc::Sender<(NodeId, RaftMessage)>) {\n        while let Ok(Some(bytes)) = read_frame(&mut stream).await {\n            if let Ok(envelope) = serde_json::from_slice::<(NodeId, RaftMessage)>(&bytes) {\n                if tx.send(envelope).await.is_err() {\n                    break;\n                }\n            }\n        }\n    }\n"""
          new_accept_conn = """    async fn accept_conn(\n        mut stream: TcpStream,\n        tx: mpsc::Sender<(NodeId, RaftMessage)>,\n        writers: Arc<Mutex<HashMap<NodeId, mpsc::Sender<RaftMessage>>>>,\n        peer_incarnations: Arc<Mutex<PeerIncarnations>>,\n    ) {\n        while let Ok(Some(bytes)) = read_frame(&mut stream).await {\n            let Ok((from, incarnation, message)) = serde_json::from_slice::<WireEnvelope>(&bytes)\n            else {\n                continue;\n            };\n            let observation = peer_incarnations.lock().await.observe(&from, incarnation);\n            if observation == PeerIncarnationObservation::Retired {\n                tracing::debug!(peer = %from, incarnation, \"discard retired Raft peer incarnation\");\n                continue;\n            }\n            if observation == PeerIncarnationObservation::Replaced {\n                writers.lock().await.remove(&from);\n                tracing::debug!(peer = %from, incarnation, \"observed new Raft peer incarnation; reset reverse session\");\n            }\n            if tx.send((from, message)).await.is_err() {\n                break;\n            }\n        }\n    }\n"""
          if text.count(old_accept_conn) != 1:
              raise SystemExit(f"accept_conn anchor count={text.count(old_accept_conn)}")
          text = text.replace(old_accept_conn, new_accept_conn, 1)

          old_tcp_spawn = """        tokio::spawn(run_tcp_peer_writer(local_id, peer_id.clone(), addr, rx));\n"""
          new_tcp_spawn = """        tokio::spawn(run_tcp_peer_writer(\n            local_id,\n            self.incarnation,\n            peer_id.clone(),\n            addr,\n            rx,\n        ));\n"""
          if text.count(old_tcp_spawn) != 1:
              raise SystemExit(f"tcp writer spawn anchor count={text.count(old_tcp_spawn)}")
          text = text.replace(old_tcp_spawn, new_tcp_spawn, 1)

          old_tcp_sig = """async fn run_tcp_peer_writer(\n    local_id: NodeId,\n    peer_id: NodeId,\n"""
          new_tcp_sig = """async fn run_tcp_peer_writer(\n    local_id: NodeId,\n    local_incarnation: u64,\n    peer_id: NodeId,\n"""
          if text.count(old_tcp_sig) != 1:
              raise SystemExit(f"tcp writer sig anchor count={text.count(old_tcp_sig)}")
          text = text.replace(old_tcp_sig, new_tcp_sig, 1)

          old_payload = """        let payload = match serde_json::to_vec(&(local_id.clone(), msg)) {\n"""
          new_payload = """        let payload = match serde_json::to_vec(&(local_id.clone(), local_incarnation, msg)) {\n"""
          if text.count(old_payload) != 2:
              raise SystemExit(f"payload anchor count={text.count(old_payload)}")
          text = text.replace(old_payload, new_payload, 2)

          old_tls_setup = """        let (shutdown_tx, mut shutdown_rx) = oneshot::channel::<()>();\n        let tx_clone = tx.clone();\n\n        let accept_task = tokio::spawn(async move {\n"""
          new_tls_setup = """        let (shutdown_tx, mut shutdown_rx) = oneshot::channel::<()>();\n        let tx_clone = tx.clone();\n        let writers = Arc::new(Mutex::new(HashMap::new()));\n        let peer_incarnations = Arc::new(Mutex::new(PeerIncarnations::default()));\n        let accept_writers = Arc::clone(&writers);\n        let accept_peer_incarnations = Arc::clone(&peer_incarnations);\n\n        let accept_task = tokio::spawn(async move {\n"""
          if text.count(old_tls_setup) != 1:
              raise SystemExit(f"tls setup anchor count={text.count(old_tls_setup)}")
          text = text.replace(old_tls_setup, new_tls_setup, 1)

          old_tls_clones = """                                let acc = acceptor.clone();\n                                let tx2 = tx_clone.clone();\n                                tokio::spawn(async move {\n"""
          new_tls_clones = """                                let acc = acceptor.clone();\n                                let tx2 = tx_clone.clone();\n                                let writers2 = Arc::clone(&accept_writers);\n                                let incarnations2 = Arc::clone(&accept_peer_incarnations);\n                                tokio::spawn(async move {\n"""
          if text.count(old_tls_clones) != 1:
              raise SystemExit(f"tls clone anchor count={text.count(old_tls_clones)}")
          text = text.replace(old_tls_clones, new_tls_clones, 1)

          old_tls_loop = """                                            while let Ok(Some(bytes)) = read_frame_generic(&mut tls).await {\n                                                if let Ok(envelope) =\n                                                    serde_json::from_slice::<(NodeId, RaftMessage)>(&bytes)\n                                                {\n                                                    if tx2.send(envelope).await.is_err() {\n                                                        break;\n                                                    }\n                                                }\n                                            }\n"""
          new_tls_loop = """                                            while let Ok(Some(bytes)) = read_frame_generic(&mut tls).await {\n                                                let Ok((from, incarnation, message)) =\n                                                    serde_json::from_slice::<WireEnvelope>(&bytes)\n                                                else {\n                                                    continue;\n                                                };\n                                                let observation = incarnations2\n                                                    .lock()\n                                                    .await\n                                                    .observe(&from, incarnation);\n                                                if observation == PeerIncarnationObservation::Retired {\n                                                    tracing::debug!(peer = %from, incarnation, \"discard retired Raft TLS peer incarnation\");\n                                                    continue;\n                                                }\n                                                if observation == PeerIncarnationObservation::Replaced {\n                                                    writers2.lock().await.remove(&from);\n                                                    tracing::debug!(peer = %from, incarnation, \"observed new Raft TLS peer incarnation; reset reverse session\");\n                                                }\n                                                if tx2.send((from, message)).await.is_err() {\n                                                    break;\n                                                }\n                                            }\n"""
          if text.count(old_tls_loop) != 1:
              raise SystemExit(f"tls loop anchor count={text.count(old_tls_loop)}")
          text = text.replace(old_tls_loop, new_tls_loop, 1)

          old_tls_init = """            rx: Arc::new(Mutex::new(rx)),\n            writers: Arc::new(Mutex::new(HashMap::new())),\n            shutdown_tx: Some(shutdown_tx),\n"""
          new_tls_init = """            rx: Arc::new(Mutex::new(rx)),\n            writers,\n            incarnation: rand::random::<u64>(),\n            peer_incarnations,\n            shutdown_tx: Some(shutdown_tx),\n"""
          if text.count(old_tls_init) != 1:
              raise SystemExit(f"tls init anchor count={text.count(old_tls_init)}")
          text = text.replace(old_tls_init, new_tls_init, 1)

          old_tls_spawn = """        tokio::spawn(run_tls_peer_writer(\n            local_id,\n            peer_id.clone(),\n"""
          new_tls_spawn = """        tokio::spawn(run_tls_peer_writer(\n            local_id,\n            self.incarnation,\n            peer_id.clone(),\n"""
          if text.count(old_tls_spawn) != 1:
              raise SystemExit(f"tls writer spawn anchor count={text.count(old_tls_spawn)}")
          text = text.replace(old_tls_spawn, new_tls_spawn, 1)

          old_tls_sig = """async fn run_tls_peer_writer(\n    local_id: NodeId,\n    peer_id: NodeId,\n"""
          new_tls_sig = """async fn run_tls_peer_writer(\n    local_id: NodeId,\n    local_incarnation: u64,\n    peer_id: NodeId,\n"""
          if text.count(old_tls_sig) != 1:
              raise SystemExit(f"tls writer sig anchor count={text.count(old_tls_sig)}")
          text = text.replace(old_tls_sig, new_tls_sig, 1)

          unit_anchor = """// ── TCP transport ──────────────────────────────────────────────────────────\n"""
          unit = """#[cfg(test)]\nmod incarnation_tests {\n    use super::*;\n\n    #[test]\n    fn peer_incarnation_replacement_is_monotonic_with_retired_epoch_rejection() {\n        let peer = \"peer-a\".to_string();\n        let mut epochs = PeerIncarnations::default();\n        assert_eq!(epochs.observe(&peer, 10), PeerIncarnationObservation::First);\n        assert_eq!(epochs.observe(&peer, 10), PeerIncarnationObservation::Current);\n        assert_eq!(epochs.observe(&peer, 20), PeerIncarnationObservation::Replaced);\n        assert_eq!(epochs.observe(&peer, 10), PeerIncarnationObservation::Retired);\n        assert_eq!(epochs.observe(&peer, 20), PeerIncarnationObservation::Current);\n        assert_eq!(epochs.observe(&peer, 30), PeerIncarnationObservation::Replaced);\n        assert_eq!(epochs.observe(&peer, 20), PeerIncarnationObservation::Retired);\n    }\n}\n\n// ── TCP transport ──────────────────────────────────────────────────────────\n"""
          if text.count(unit_anchor) != 1:
              raise SystemExit(f"unit anchor count={text.count(unit_anchor)}")
          text = text.replace(unit_anchor, unit, 1)
          p.write_text(text)

          t = Path("tests/raft_tcp_transport.rs")
          text = t.read_text()
          old_helper = """async fn read_envelope(stream: &mut tokio::net::TcpStream) -> (String, RaftMessage) {\n    let mut len = [0u8; 4];\n    stream\n        .read_exact(&mut len)\n        .await\n        .expect(\"read frame length\");\n    let mut payload = vec![0u8; u32::from_be_bytes(len) as usize];\n    stream\n        .read_exact(&mut payload)\n        .await\n        .expect(\"read frame payload\");\n    serde_json::from_slice(&payload).expect(\"decode Raft envelope\")\n}\n"""
          new_helper = """async fn read_envelope(stream: &mut tokio::net::TcpStream) -> (String, u64, RaftMessage) {\n    let mut len = [0u8; 4];\n    stream\n        .read_exact(&mut len)\n        .await\n        .expect(\"read frame length\");\n    let mut payload = vec![0u8; u32::from_be_bytes(len) as usize];\n    stream\n        .read_exact(&mut payload)\n        .await\n        .expect(\"read frame payload\");\n    serde_json::from_slice(&payload).expect(\"decode Raft envelope\")\n}\n"""
          if text.count(old_helper) != 1:
              raise SystemExit(f"test helper anchor count={text.count(old_helper)}")
          text = text.replace(old_helper, new_helper, 1)
          text = text.replace(
              "    let (_, first) = timeout(Duration::from_secs(2), read_envelope(&mut stale))",
              "    let (_, first_incarnation, first) = timeout(Duration::from_secs(2), read_envelope(&mut stale))",
              1,
          )
          text = text.replace(
              "    let (from, second) = timeout(Duration::from_secs(2), read_envelope(&mut fresh))",
              "    let (from, second_incarnation, second) = timeout(Duration::from_secs(2), read_envelope(&mut fresh))",
              1,
          )
          marker = """    assert_eq!(from, \"n1\");\n    match second {\n"""
          replacement = """    assert_eq!(from, \"n1\");\n    assert_eq!(\n        first_incarnation, second_incarnation,\n        \"transport incarnation must survive ordinary connection resets\"\n    );\n    match second {\n"""
          if text.count(marker) != 1:
              raise SystemExit(f"incarnation assertion anchor count={text.count(marker)}")
          text = text.replace(marker, replacement, 1)
          t.write_text(text)
          PY
      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check
          git diff -- src/consensus/transport.rs tests/raft_tcp_transport.rs
      - name: Run focused transport and transfer regressions
        run: |
          cargo test --features tls --locked consensus::transport::incarnation_tests::peer_incarnation_replacement_is_monotonic_with_retired_epoch_rejection
          cargo test --features tls --locked \
            --test raft_tcp_transport \
            --test raft_election_term_fencing \
            --test phase7_guarded_membership \
            --test raft_restart_commit_recovery \
            --test raft_durable_apply_frontier
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/consensus/transport.rs tests/raft_tcp_transport.rs
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "Fence Raft transport sessions by process incarnation"
          git push origin HEAD:phase11-sota-pass1
