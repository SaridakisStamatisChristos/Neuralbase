name: phase5-encrypted-cli-security-staging

on:
  push:
    branches:
      - phase5-encrypted-cli-security-staging

permissions:
  contents: write

jobs:
  encrypted-cli-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: phase5-encrypted-cli-security-staging
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Prepare CLI secrecy evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'fn encrypted_cli_never_echoes_raw_key_material()' tests/phase5_encrypted_ops.rs; then
            echo 'CLI secrecy evidence already committed; testing it directly'
          else
            python3 scripts/phase5_encrypted_cli_security_patch.py
          fi
          cargo fmt --all

      - name: Run encrypted CLI security tests
        run: |
          cargo test --test phase5_encrypted_ops --locked
          cargo test --bin neuralbase-backup --locked

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Run all-features Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit tested permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/phase5_encrypted_ops.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase5_encrypted_ops.rs
          git commit -m "Prove encrypted backup CLI secret handling"
          git push origin HEAD:phase5-encrypted-cli-security-staging
