name: phase5-fix-allfeatures-clippy

on:
  push:
    branches:
      - phase5-nbec-rebased-staging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: phase5-nbec-rebased-staging
          persist-credentials: true
      - name: Fix latent all-features Clippy warning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/tpch_correctness.rs')
          s = p.read_text()
          old = '''    panic!(\n        "failed to connect to PostgreSQL 16 reference: {:?}",\n        last_err\n    );'''
          new = '''    panic!("failed to connect to PostgreSQL 16 reference: {last_err:?}");'''
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('expected TPC-H panic block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/tpch_correctness.rs
          git commit -m "Fix all-features TPC-H Clippy warning"
          git push origin HEAD:phase5-nbec-rebased-staging
