name: one-shot-campaign-jitter

on:
  push:
    branches:
      - phase11-sota-pass1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase11-sota-pass1
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply randomized campaign retry repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/consensus/raft.rs")
          text = p.read_text()
          old = """    fn campaign_timeout(&self) -> Duration {
        Duration::from_millis(
            ELECTION_CAMPAIGN_GRACE_MS.max(self.election_timeout_base_ms.saturating_mul(2)),
        )
    }
"""
          new = """    fn campaign_timeout(&self) -> Duration {
        // Failed campaigns must not retry on a deterministic cadence. Two
        // candidates that split a vote at nearly the same instant would
        // otherwise preserve that phase forever by retrying every exact 2s.
        // Keep the minimum above the transport's reliable-delivery window, then
        // add fresh full-width jitter so the next campaign naturally dephases.
        let floor =
            ELECTION_CAMPAIGN_GRACE_MS.max(self.election_timeout_base_ms.saturating_mul(2));
        let extra = rand::thread_rng().gen_range(0..floor.max(10));
        Duration::from_millis(floor.saturating_add(extra))
    }
"""
          if text.count(old) != 1:
              raise SystemExit(f"campaign timeout anchor count={text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check
          git diff -- src/consensus/raft.rs
      - name: Run focused election and real-process regressions
        run: |
          cargo test --features tls --locked \
            --test raft_election_term_fencing \
            --test raft_restart_commit_recovery \
            --test raft_durable_apply_frontier \
            --test phase7_guarded_membership
          for i in 1 2 3; do
            echo "replicated_sql_process pass $i"
            cargo test --locked --test replicated_sql_process -- --nocapture
          done
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/consensus/raft.rs
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "Randomize Raft campaign retry deadlines"
          git push origin HEAD:phase11-sota-pass1
