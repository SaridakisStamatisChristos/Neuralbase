name: phase5-encrypted-ops-staging

on:
  push:
    branches:
      - phase5-encrypted-ops-staging

permissions:
  contents: write

jobs:
  encrypted-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout encrypted-ops staging
        uses: actions/checkout@v5
        with:
          ref: phase5-encrypted-ops-staging
          persist-credentials: true

      - name: Apply encrypted operator-path slice
        run: |
          python3 scripts/phase5_encrypted_ops_patch.py
          cargo fmt --all

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run encrypted operator-path tests
        run: |
          cargo test --lib backup_encryption::tests --locked
          cargo test --test phase5_encrypted_ops --locked
          cargo test --bin neuralbase-backup --locked

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Run all-features Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit tested staging slice
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/offline_backup.rs src/backup_encryption.rs src/restore.rs src/bin/neuralbase-backup.rs tests/phase5_encrypted_ops.rs
          git commit -m "Add encrypted backup operator paths"
          git push origin HEAD:phase5-encrypted-ops-staging
