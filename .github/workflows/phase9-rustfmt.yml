name: phase9-rustfmt

on:
  push:
    branches:
      - phase9-pitr-archive-stream

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 9 branch
        uses: actions/checkout@v5
        with:
          ref: phase9-pitr-archive-stream

      - name: Setup repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Format Phase 9 Rust sources
        run: cargo fmt --all

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bin/neuralbase-pitr.rs \
            src/pitr.rs \
            src/pitr_archive.rs \
            src/pitr_branch.rs \
            src/pitr_replay.rs \
            src/pitr_retention.rs \
            src/pitr_runtime.rs \
            tests/phase9_pitr_process.rs
          git diff --cached --check
          git commit -m "style(pitr): apply rustfmt"
          git push origin HEAD:phase9-pitr-archive-stream
