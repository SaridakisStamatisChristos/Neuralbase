name: phase9-hardening

on:
  push:
    branches:
      - phase9-pitr-archive-stream

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout Phase 9 branch
        uses: actions/checkout@v5
        with:
          ref: phase9-pitr-archive-stream
      - name: Apply hardening patch
        run: python .github/phase9_harden.py
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Validate hardening
        run: |
          cargo fmt --all
          cargo test pitr --lib
          cargo clippy --all-targets --locked -- -D warnings
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pitr.rs src/pitr_archive.rs src/pitr_runtime.rs src/pitr_branch.rs src/pitr_replay.rs
          git diff --cached --check
          git commit -m "test(pitr): harden archive recovery boundaries"
          git push origin HEAD:phase9-pitr-archive-stream
