name: phase5-preenc-deadcode-fix

on:
  push:
    branches:
      - phase5-backup-restore-dr

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 5 branch
        uses: actions/checkout@v5
        with:
          ref: phase5-backup-restore-dr
          persist-credentials: true

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Make pre-encryption helpers test-only and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/backup.rs')
          s = p.read_text()
          targets = [
              '    pub(crate) fn encode_encrypted_payload(&self) -> Result<Vec<u8>, BackupCodecError> {',
              '    pub(crate) fn decode_encrypted_payload(bytes: &[u8]) -> Result<Self, BackupCodecError> {',
          ]
          for target in targets:
              guarded = '    #[cfg(test)]\n' + target
              if guarded not in s:
                  if target not in s:
                      raise SystemExit(f'missing expected target: {target}')
                  s = s.replace(target, guarded, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          if git diff --quiet; then
            echo "pre-encryption dead-code boundary already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backup.rs
          git commit -m "Gate NBEC helpers until encryption module lands"
          git push origin HEAD:phase5-backup-restore-dr
