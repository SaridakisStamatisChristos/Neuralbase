name: rustfmt-temp

on:
  push:
    branches:
      - automation/rustfmt-replicated-sql

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/rustfmt-replicated-sql
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format branch
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m '[rustfmt-bot] Apply rustfmt'
          git push origin HEAD:automation/rustfmt-replicated-sql
