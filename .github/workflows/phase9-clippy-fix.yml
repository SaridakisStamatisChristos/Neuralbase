name: phase9-clippy-fix

on:
  push:
    branches:
      - phase9-pitr-archive-stream

permissions:
  contents: write

jobs:
  clippy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout Phase 9 branch
        uses: actions/checkout@v5
        with:
          ref: phase9-pitr-archive-stream

      - name: Remove redundant branched metadata helper
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pitr_archive.rs")
          text = path.read_text()
          old_method = '''    pub fn branched(
              &self,
              new_timeline: TimelineId,
              branch_index: u64,
              baseline_backup_sha256: ArchiveHash,
              baseline_term: u64,
              membership_generation: u64,
              membership_config_index: u64,
              encrypted: bool,
              key_id: Option<KeyId>,
          ) -> Result<Self, PitrArchiveError> {
              if branch_index < self.baseline_index {
                  return Err(PitrArchiveError::InvalidMetadata(
                      "branch index precedes parent baseline".into(),
                  ));
              }
              let metadata = Self {
                  format_version: STREAM_METADATA_VERSION,
                  archive_format_version: ARCHIVE_FORMAT_VERSION,
                  state_machine_compat_version: ARCHIVE_STATE_MACHINE_COMPAT_VERSION,
                  timeline: new_timeline,
                  parent_timeline: Some(self.timeline),
                  branch_index: Some(branch_index),
                  baseline_backup_sha256,
                  baseline_index: branch_index,
                  baseline_term,
                  baseline_membership_generation: membership_generation,
                  baseline_membership_config_index: membership_config_index,
                  encrypted,
                  key_id,
              };
              metadata.validate()?;
              Ok(metadata)
          }

'''
          if old_method not in text:
              raise SystemExit("expected branched helper not found")
          text = text.replace(old_method, "", 1)

          old_test = '''        let metadata =
              ArchiveStreamMetadata::from_backup(&backup, [3u8; 32], timeline, false, None).unwrap();
          let error = metadata
              .branched(timeline, 5, [3u8; 32], 2, 4, 5, false, None)
              .unwrap_err();
          assert!(matches!(error, PitrArchiveError::InvalidMetadata(_)));
'''
          new_test = '''        let mut metadata =
              ArchiveStreamMetadata::from_backup(&backup, [3u8; 32], timeline, false, None).unwrap();
          metadata.parent_timeline = Some(timeline);
          metadata.branch_index = Some(metadata.baseline_index);
          let error = metadata.validate().unwrap_err();
          assert!(matches!(error, PitrArchiveError::InvalidMetadata(_)));
'''
          if old_test not in text:
              raise SystemExit("expected branch-aliasing test body not found")
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm

      - name: Setup repository Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Verify formatting and Clippy
        run: |
          cargo fmt --all
          cargo clippy --all-targets --locked -- -D warnings

      - name: Commit validated lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pitr_archive.rs
          git diff --cached --check
          git commit -m "refactor(pitr): remove redundant branch metadata helper"
          git push origin HEAD:phase9-pitr-archive-stream
