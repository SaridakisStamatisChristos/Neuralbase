name: phase5-encrypted-online-staging

on:
  push:
    branches:
      - phase5-encrypted-online-staging

permissions:
  contents: write

jobs:
  encrypted-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: phase5-encrypted-online-staging
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Prepare encrypted online slice
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'pub async fn create_encrypted_online_backup(' src/online_backup.rs \
             && grep -q 'pub(crate) fn publish_encrypted_backup(' src/backup_encryption.rs; then
            echo 'encrypted online source already committed; testing it directly'
          else
            python3 scripts/phase5_encrypted_online_patch.py
          fi
          cargo fmt --all

      - name: Run focused online backup tests
        run: |
          cargo test --lib online_backup::tests --locked
          cargo test --lib backup_encryption::tests --locked
          cargo test --test phase5_online_backup_interactions --locked

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Run all-features Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit tested permanent slice
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/backup_encryption.rs src/online_backup.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backup_encryption.rs src/online_backup.rs
          git commit -m "Add encrypted online backup publication"
          git push origin HEAD:phase5-encrypted-online-staging
