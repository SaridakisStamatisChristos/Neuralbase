name: phase5-docs-staging

on:
  push:
    branches:
      - phase5-docs-staging

permissions:
  contents: write

jobs:
  docs-confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: phase5-docs-staging
          persist-credentials: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Apply Phase 5 documentation synchronization
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'operator_backup_restore: true' CONFIDENCE.yaml \
             && grep -q 'Completed Phase 5 — operational backup' ROADMAP.md; then
            echo 'Phase 5 docs already committed; validating directly'
          else
            python3 scripts/phase5_docs_patch.py
          fi
          cargo fmt --all

      - name: Run confidence gate
        run: make confidence

      - name: Reject stale Phase-4 recovery claims
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '| Backup / PITR / disaster recovery | **Not implemented** |' README.md
          ! grep -Fq 'backup/PITR/disaster recovery, and production-HA claims' docs/README.md
          ! grep -Fq 'backup/PITR/disaster recovery, broader authorization' docs/DISTRIBUTED.md
          ! grep -Fq 'backup/PITR/disaster recovery, target-environment' docs/DEPLOYMENT.md
          ! grep -Fq 'backup/PITR/disaster recovery, security certification' docs/TESTING.md
          ! grep -Fq 'backup/restore, PITR or disaster recovery;' CONFIDENCE.md
          ! grep -Fq 'backup/restore, PITR, or disaster recovery.' CONFIDENCE.yaml
          ! grep -Fq 'backup/disaster-recovery workflows remain open' AGENTS.md
          ! grep -Fq 'SQL data and user-registry state are per-node' SECURITY.md

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Commit validated permanent documentation
        shell: bash
        run: |
          set -euo pipefail
          paths=(README.md docs/README.md docs/ARCHITECTURE.md docs/DISTRIBUTED.md docs/DEPLOYMENT.md docs/TESTING.md docs/THREAT_MODEL.md ROADMAP.md CONFIDENCE.md CONFIDENCE.yaml tests/confidence_yaml.rs CHANGELOG.md AGENTS.md SECURITY.md ops/RUNBOOK.md)
          if git diff --quiet -- "${paths[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Document Phase 5 recovery evidence and limits"
          git push origin HEAD:phase5-docs-staging
