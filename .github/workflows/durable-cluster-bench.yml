name: durable-cluster-bench

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/perf_durable_cluster.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/durable-cluster-bench.yml'

permissions:
  contents: read

concurrency:
  group: durable-cluster-bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  three-durable-voters:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      ROCKSDB_INCLUDE_DIR: /usr/include
      # Legacy PHASE11_* tokens are retained by the benchmark result protocol so
      # archived datasets remain machine-comparable across the namespace cleanup.
      PHASE11_RESULTS_DIR: /tmp/durable-cluster-results
      PHASE11_LABEL: head
      PHASE11_MEASURED_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout benchmark head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            llvm-18-dev \
            libclang-18-dev \
            clang-18 \
            librocksdb-dev \
            nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-durable-cluster-${{ hashFiles('Cargo.lock') }}

      - name: Capture runner environment
        run: |
          mkdir -p /tmp/durable-cluster-results
          {
            echo "commit=${PHASE11_MEASURED_COMMIT}"
            echo "runner_os=${RUNNER_OS}"
            echo "kernel=$(uname -a)"
            echo "rustc=$(rustc --version --verbose | tr '\n' ' ')"
            echo "cpu=$(lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tr '\n' ';')"
            echo "memory=$(grep MemTotal /proc/meminfo)"
            echo "filesystem=$(df -T . | tail -1)"
          } | tee /tmp/durable-cluster-results/environment.txt

      - name: Run harness regressions and three-voter smoke test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test perf_durable_cluster --release --locked \
            -- --nocapture --test-threads=1 \
            2>&1 | tee /tmp/durable-cluster-results/smoke.log

      - name: Run three-voter durable benchmark
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test perf_durable_cluster --release --locked \
            three_durable_voters_dataset_and_concurrency_characterization \
            -- --ignored --nocapture --test-threads=1 \
            2>&1 | tee /tmp/durable-cluster-results/durable-cluster.log

      - name: Extract machine-readable results
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["PHASE11_RESULTS_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          log = root / "durable-cluster.log"
          records = {name: [] for name in ("RESULT", "MEMORY", "SETUP", "COMPLETE")}
          for line in log.read_text().splitlines() if log.exists() else []:
              match = re.search(r"PHASE11_(RESULT|MEMORY|SETUP|COMPLETE) (\{.*\})$", line)
              if match:
                  records[match[1]].append(json.loads(match[2]))
          for kind, filename in (("RESULT", "results"), ("MEMORY", "memory"), ("SETUP", "setup")):
              (root / f"{filename}.jsonl").write_text(
                  "".join(json.dumps(record) + "\n" for record in records[kind])
              )
          complete = records["COMPLETE"]
          results = records["RESULT"]
          assert len(complete) == 1, "benchmark incomplete; inspect smoke/test and node logs"
          assert len(results) == complete[0]["result_count"], "missing benchmark cases"
          assert len({r["name"] for r in results}) == len(results), "duplicate cases"
          assert all(r["commit"] == os.environ["PHASE11_MEASURED_COMMIT"] for r in results)
          assert all(r["failed_ops"] == 0 and r["successful_ops"] == r["measured_iterations"] for r in results)
          print(f"Validated {len(results)} completed benchmark cases")
          PYTHON

      - name: Upload durable-cluster characterization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-three-voters-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: /tmp/durable-cluster-results
          if-no-files-found: error
          retention-days: 30
