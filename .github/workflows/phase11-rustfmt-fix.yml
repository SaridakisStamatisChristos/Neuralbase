name: Phase 11 rustfmt fix

on:
  push:
    branches:
      - phase11-sota-pass1

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v5
        with:
          ref: phase11-sota-pass1
          fetch-depth: 0

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/phase11-rustfmt-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: rustfmt Phase 11 performance changes'
          git push origin HEAD:phase11-sota-pass1
