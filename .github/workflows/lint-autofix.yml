name: One-shot Clippy autofix

on:
  push:
    branches:
      - docs/professional-presentation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v5
        with:
          ref: docs/professional-presentation
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev libclang-18-dev clang-18 librocksdb-dev nasm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Apply only uninlined-format-args fixes
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          ROCKSDB_INCLUDE_DIR: /usr/include
        run: |
          cargo clippy --fix --all-targets --locked --allow-dirty --allow-staged -- \
            -A clippy::all -W clippy::uninlined_format_args
          cargo fmt --all

      - name: Remove one-shot workflow and commit fixes
        run: |
          git rm .github/workflows/lint-autofix.yml
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'style: apply Rust 1.88 Clippy format-argument fixes'
          git push origin HEAD:docs/professional-presentation
