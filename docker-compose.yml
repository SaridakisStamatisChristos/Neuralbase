# SPDX-License-Identifier: Apache-2.0
# 3-node NeuralBase cluster for local development and integration testing.
#
# Usage:
#   docker compose up -d --wait
#   psql -h 127.0.0.1 -p 5432 -U anon -c "SELECT 1"
#   docker compose down

version: "3.9"

x-neuralbase-common: &neuralbase-common
  image: neuralbase:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    NEURALBASE_TLS_CERT: /certs/server.crt
    NEURALBASE_TLS_KEY: /certs/server.key
  volumes:
    - ./certs:/certs:ro
  healthcheck:
    test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/5432'"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

services:
  node1:
    <<: *neuralbase-common
    container_name: neuralbase-node1
    environment:
      NODE_ID: "node1"
      LISTEN_ADDR: "0.0.0.0:5432"
      RAFT_ADDR: "0.0.0.0:7001"
      PEERS: "node2=node2:7001,node3=node3:7001"
      DB_PATH: "/data/neuralbase"
      NEURALBASE_USERS_FILE: "/data/neuralbase/users.json"
      METRICS_PORT: "9090"
    volumes:
      - ./certs:/certs:ro
      - node1_data:/data/neuralbase
    ports:
      - "5432:5432"
      - "7001:7001"
      - "8001:8001"
      - "9090:9090"

  node2:
    <<: *neuralbase-common
    container_name: neuralbase-node2
    environment:
      NODE_ID: "node2"
      LISTEN_ADDR: "0.0.0.0:5432"
      RAFT_ADDR: "0.0.0.0:7001"
      PEERS: "node1=node1:7001,node3=node3:7001"
      DB_PATH: "/data/neuralbase"
      NEURALBASE_USERS_FILE: "/data/neuralbase/users.json"
      METRICS_PORT: "9090"
    volumes:
      - ./certs:/certs:ro
      - node2_data:/data/neuralbase
    ports:
      - "5433:5432"
      - "7002:7001"
      - "8002:8001"
      - "9091:9090"

  node3:
    <<: *neuralbase-common
    container_name: neuralbase-node3
    environment:
      NODE_ID: "node3"
      LISTEN_ADDR: "0.0.0.0:5432"
      RAFT_ADDR: "0.0.0.0:7001"
      PEERS: "node1=node1:7001,node2=node2:7001"
      DB_PATH: "/data/neuralbase"
      NEURALBASE_USERS_FILE: "/data/neuralbase/users.json"
      METRICS_PORT: "9090"
    volumes:
      - ./certs:/certs:ro
      - node3_data:/data/neuralbase
    ports:
      - "5434:5432"
      - "7003:7001"
      - "8003:8001"
      - "9092:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: neuralbase-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: neuralbase-prometheus
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9093:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: neuralbase-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "neuralbase"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  node1_data:
  node2_data:
  node3_data:
  grafana_data:
