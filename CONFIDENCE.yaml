system:
  scope: local_sql_engine_and_raft_subsystem
  effective_confidence: 0.78
  production_ready: false
  distributed_sql_replication: false
  summary: >-
    Confidence applies to the tested local SQL/MVCC engine and to the Raft
    subsystem as separate components. It does not imply that SQL mutations are
    replicated through Raft or that the deployment is a highly available
    replicated database.

