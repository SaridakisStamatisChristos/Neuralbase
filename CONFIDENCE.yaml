verification_policy:
  - No performance claim without a reproducible benchmark and workload context.
  - distributed_sql_replication means only the machine-readable replication_scope above.
  - production_ready and production_ha remain false despite membership, identity, recovery, read-consistency, managed-reconciliation, Phase-8 SQL, and Phase-9 exact-index PITR progress.
  - pitr=true means only the Phase-9 exact committed-Raft-index archive/replay contract; pitr_timestamp_targets and automatic_dr remain false.
  - Keep SQL correctness claims synchronized with SQL_COMPATIBILITY.yaml and executable PostgreSQL reference tests.
  - Keep arbitrary Helm/HPA scaling unsupported; the managed Phase-7 profile must sequence changes through guarded committed membership.
  - Replicated identity claims require verifier-only log material and explicit legacy migration semantics.
  - Follower authentication reads locally applied identity without a quorum barrier; user DDL does not terminate existing sessions.
  - Library optimizer/exchange components do not establish live SQL planner or distributed-query integration.
  - Strong-read claims require explicit current-leader authority, quorum barrier, confirmed local apply, and no silent downgrade.
  - Phase-8 extended-protocol claims remain limited to the declared typed subset; SQL transactions, arbitrary OID inference, binary row output and full PostgreSQL protocol error state remain unsupported.
  - A release head must pass tests, lint, confidence checks, adversarial tests, TPC-H plus semantic PostgreSQL reference validation, Helm rendering, and the managed Kubernetes lifecycle gate.

next_high_value_work:
  - Continue SQL semantic depth with exact NUMERIC/decimal behavior, broader date/time/timestamp semantics, locale/collation work, enforceable constraints and fuller wire metadata/error-state compatibility.
  - Preserve the explicit unsupported boundary for SQL transaction blocks until multi-statement/distributed semantics can be implemented without weakening replicated-state safety.
  - Harden the managed reconciliation profile for upgrades, broader network/storage chaos, and production-grade security without enabling raw HPA scaling.
  - Add timestamp-to-index recovery mapping only with an explicit durable time/index contract; do not infer it from Phase-9 exact-index PITR.
  - Expand authorization/security and upgrade/storage-chaos hardening.
  - Optimize strong reads with ReadIndex/lease mechanics only if the Phase-6 public contract and failure semantics remain unchanged.