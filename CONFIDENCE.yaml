  summary: >-
    Confidence covers the tested local SQL/MVCC engine, replicated persistent-table
    mutations, SQL-aware snapshot/recovery, coordinated learner/joint-consensus
    membership changes, replicated SCRAM identity, operator backup/restore and
    fresh-cluster recovery, Local/Leader/Linearizable leader-path read semantics,
    opt-in managed process/Kubernetes membership reconciliation, the explicit SQL
    semantic/compatibility profile, and exact committed-index archived recovery/PITR.
    SQL semantic hardening includes fail-closed unsupported DML/DDL semantics,
    single-statement request enforcement, selected PostgreSQL-16 differential
    scalar/window evidence, and a typed extended-protocol subset with real
    postgres-client evidence. Exact-index recovery includes strict hash-linked
    archive records, optional authenticated archive encryption, synchronous
    archive-before-confirmed-apply fencing, replay into a fresh verified recovery
    generation, child timeline branching and conservative bounded retention. This
    does not imply production HA, full PostgreSQL compatibility, SQL transaction
    blocks, arbitrary-follower linearizable reads, automatic strong-read routing,
    arbitrary Helm/HPA replica scaling, timestamp-target PITR, or automatic DR.

