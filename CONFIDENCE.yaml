version: 2
updated: 2026-09-07

system:
  scope: local_sql_engine_plus_fixed_membership_replicated_table_mutations
  effective_confidence: 0.78
  production_ready: false
  distributed_sql_replication: true
  replication_scope:
    fixed_membership: true
    table_ddl:
      - create_table
      - drop_table
    table_dml:
      - insert
      - update
      - delete
    follower_writes: reject
    follower_reads_linearizable: false
    auth_replication: false
    dynamic_membership: false
    sql_snapshots: false
    production_ha: false
  summary: >-
    Confidence covers the tested local SQL/MVCC engine and a fixed-membership
    replicated mutation path for persistent table CREATE/DROP/INSERT/UPDATE/DELETE.
    Clustered write success waits for Raft quorum commit and confirmed durable
    local state-machine apply. This does not imply production HA, linearizable
    follower reads, replicated authentication state, dynamic membership, or
    SQL snapshot/node-replacement recovery.

