  summary: >-
    Confidence covers the tested local SQL/MVCC engine, replicated persistent-table
    mutations, SQL-aware snapshot/recovery, coordinated learner/joint-consensus
    membership changes, replicated SCRAM identity, Phase-5 operator recovery,
    Phase-6 Local/Leader/Linearizable leader-path read semantics, the opt-in Phase-7
    managed process/Kubernetes membership reconciliation profile, and the explicit
    Phase-8 SQL compatibility profile, and Phase-9 exact committed-index archived
    recovery/PITR. Phase 8 adds fail-closed unsupported DML/DDL semantics,
    single-statement request enforcement, selected PostgreSQL-16 differential
    scalar/window evidence, and a typed extended-protocol subset with real
    postgres-client evidence. Phase 9 adds strict hash-linked archive records,
    optional authenticated archive encryption, synchronous archive-before-confirmed-
    apply fencing, exact-index replay into a fresh verified recovery generation,
    child timeline branching and conservative bounded retention. This does not imply
    production HA, full PostgreSQL compatibility, SQL transaction blocks, arbitrary-
    follower linearizable reads, automatic strong-read routing, arbitrary Helm/HPA
    replica scaling, timestamp-target PITR, or automatic disaster recovery.

