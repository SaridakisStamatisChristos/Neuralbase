  summary: >-
    Confidence covers the tested local SQL/MVCC engine, replicated persistent-table
    mutations, SQL-aware snapshot/recovery, coordinated learner/joint-consensus
    membership changes, replicated SCRAM identity, Phase-5 operator recovery,
    Phase-6 Local/Leader/Linearizable leader-path read semantics, and the opt-in
    Phase-7 managed process/Kubernetes membership reconciliation profile. Replicated
    mutation success and strong-read barriers wait for Raft quorum commit and
    confirmed durable local state-machine apply. Managed reconciliation sequences
    fresh learner creation/catch-up/promotion, leader transfer, removal and retained
    storage under guarded committed membership. This does not imply production HA,
    linearizable arbitrary-follower reads, automatic strong-read routing, arbitrary
    Helm/HPA replica scaling, PITR, or automatic disaster recovery.

