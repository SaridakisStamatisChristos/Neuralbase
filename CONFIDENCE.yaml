    table_dml:
      - insert
      - update
      - delete
    follower_writes: reject
    read_consistency_modes:
      - local
      - leader
      - linearizable
    strong_reads_require_current_leader: true
    strong_read_barrier: raft_log_quorum_confirmed_apply
    strong_read_silent_downgrade: false
    follower_reads_linearizable: false
    automatic_strong_read_routing: false
    readindex_or_lease_optimization: false
    sql_snapshots: true
    fixed_member_empty_storage_bootstrap: true
    dynamic_membership: true
    learner_promotion: true
    joint_consensus: true
    auth_replication: true
    replicated_auth_method: scram-sha-256
    operator_backup_restore: true
    offline_backup: true
    online_backup: true
    encrypted_backup: true
    fresh_cluster_dr: true
    pitr: false
    automatic_dr: false
    automatic_membership_reconciliation: false
    hpa_safe: false
    production_ha: false
  summary: >-
    Confidence covers the tested local SQL/MVCC engine, replicated persistent-table
    mutations, SQL-aware snapshot/recovery, coordinated learner/joint-consensus
    membership changes, replicated SCRAM identity, Phase-5 operator recovery, and
    Phase-6 Local/Leader/Linearizable leader-path read semantics. Replicated
    mutation success and strong-read barriers wait for Raft quorum commit and
    confirmed durable local state-machine apply. This does not imply production
    HA, linearizable arbitrary-follower reads, automatic strong-read routing,
    automatic Kubernetes membership reconciliation, PITR, or automatic disaster
    recovery.

