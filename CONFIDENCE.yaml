verification_policy:
  - No performance claim without a reproducible benchmark and workload context.
  - distributed_sql_replication means only the machine-readable replication_scope above.
  - distributed_sql_replication must not be interpreted as production_ready or production HA.
  - Keep SQL correctness claims synchronized with executable PostgreSQL reference tests.
  - Keep deployment examples fixed-membership until safe membership orchestration exists.
  - A release head must pass tests, lint, confidence checks, adversarial tests, TPC-H reference validation, and Helm rendering.

next_high_value_work:
  - Define SQL-aware snapshot/bootstrap and node-replacement recovery before enabling Raft log compaction in replicated-SQL mode.
  - Replicate authentication/user mutations or document a separate strongly consistent identity design.
  - Add coordinated membership changes and operator recovery workflows.
  - Add backup/restore and disaster-recovery procedures.
  - Add stronger read-consistency modes and deeper PostgreSQL compatibility only after these safety boundaries.
