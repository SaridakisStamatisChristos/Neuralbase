    effective: 0.70
    status: development_research
    evidence:
      - docker-compose.yml
      - k8s/deployment.yaml
      - helm/neuralbase
    limitation: >-
      Fixed membership only. Automatic horizontal scaling is intentionally not
      enabled because membership changes must be coordinated with Raft.

  - artifact: sql_replication
    effective: 0.0
    status: not_implemented
    criticality: release_boundary
    note: >-
      SQL DDL/DML currently executes against local RocksDB and is not submitted
      to the Raft ClientCommand/apply path. Therefore Raft quorum does not imply
      replicated SQL durability or automatic SQL failover.

verification_policy:
  - No performance claim without a reproducible benchmark and workload context.
  - No replicated-database or HA claim while system.distributed_sql_replication is false.
  - Keep SQL correctness claims synchronized with executable PostgreSQL reference tests.
  - Keep deployment examples fixed-membership until safe membership orchestration exists.
  - A release head must pass tests, lint, confidence checks, adversarial tests, and Helm rendering.

next_high_value_work:
  - Wire deterministic SQL mutation commands through Raft and apply committed entries on every node.
  - Make Raft stable-storage failures fail closed rather than logging and continuing.
  - Add separate-process restart, partition, re-election, and state convergence tests.
  - Add coordinated membership changes and operator recovery workflows.
