{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "neuralbase.fullname" . }}
  labels:
    {{- include "neuralbase.labels" . | nindent 4 }}
spec:
  # Preserve a strict Raft majority: floor(replicaCount / 2) + 1.
  minAvailable: {{ add (div (int .Values.replicaCount) 2) 1 }}
  selector:
    matchLabels:
      {{- include "neuralbase.selectorLabels" . | nindent 6 }}
{{- end }}
