{{- if ne (not (empty .Values.auth.existingSecret)) (not (empty .Values.auth.migrationSha256)) -}}
{{- fail "auth.existingSecret and auth.migrationSha256 must be supplied together for legacy identity migration" -}}
{{- end -}}
{{- if and .Values.auth.migrationSha256 (not (regexMatch "^[0-9A-Fa-f]{64}$" (toString .Values.auth.migrationSha256))) -}}
{{- fail "auth.migrationSha256 must be exactly 64 hexadecimal characters" -}}
{{- end -}}
{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) -}}
{{- fail "tls.enabled=true requires tls.existingSecret containing server.crt and server.key" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "neuralbase.fullname" . }}
  labels:
    {{- include "neuralbase.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "neuralbase.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "neuralbase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neuralbase.selectorLabels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.config.metricsPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: neuralbase
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: sql
              containerPort: 5432
            - name: raft
              containerPort: 7001
            - name: exchange
              containerPort: 8001
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: {{ include "neuralbase.fullname" . }}-config
          env:
            - name: NEURALBASE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEURALBASE_RAFT_ADDR
              value: {{ .Values.config.raftAddr | quote }}
            - name: NEURALBASE_PEERS
              value: {{ include "neuralbase.raftPeers" . | quote }}
            - name: NEURALBASE_USERS_FILE
              value: "/identity-migration/users.json"
            {{- if .Values.auth.migrationSha256 }}
            - name: NEURALBASE_IDENTITY_MIGRATION_SHA256
              value: {{ .Values.auth.migrationSha256 | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: TLS_ENABLED
              value: "1"
            - name: NEURALBASE_TLS_CERT
              value: {{ .Values.tls.certPath | quote }}
            - name: NEURALBASE_TLS_KEY
              value: {{ .Values.tls.keyPath | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dbPath }}
            {{- if .Values.auth.existingSecret }}
            - name: identity-migration
              mountPath: /identity-migration
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      {{- if or .Values.tls.enabled .Values.auth.existingSecret }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if .Values.auth.existingSecret }}
        - name: identity-migration
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            items:
              - key: users.json
                path: users.json
        {{- end }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
