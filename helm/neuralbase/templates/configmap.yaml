apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "neuralbase.fullname" . }}-config
  labels:
    {{- include "neuralbase.labels" . | nindent 4 }}
data:
  NEURALBASE_LISTEN_ADDR: {{ .Values.config.listenAddr | quote }}
  NEURALBASE_RAFT_ADDR: {{ .Values.config.raftAddr | quote }}
  NEURALBASE_METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  NEURALBASE_MAX_CONNECTIONS: {{ .Values.config.maxConnections | quote }}
  NEURALBASE_MAX_CONNECTIONS_PER_IP: {{ .Values.config.maxConnectionsPerIp | quote }}
  NEURALBASE_MAX_CONNECTIONS_PER_USER: {{ .Values.config.maxConnectionsPerUser | quote }}
  NEURALBASE_AUTH_REQUIRED: {{ .Values.config.authRequired | quote }}
  NEURALBASE_DB_PATH: {{ .Values.config.dbPath | quote }}
