# NeuralBase Helm values — configurable deployment parameters.
# Override with: helm install neuralbase ./helm/neuralbase -f custom-values.yaml

replicaCount: 3

image:
  repository: ghcr.io/saridakisstamatischristos/neuralbase
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Resource requests and limits per pod.
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

# Persistent storage for RocksDB data directory.
storage:
  size: 10Gi
  storageClassName: ""

# NeuralBase configuration (injected as env vars via ConfigMap).
config:
  listenAddr: "0.0.0.0:5432"
  raftAddr: "0.0.0.0:7001"
  metricsPort: "9090"
  maxConnections: "500"
  maxConnectionsPerIp: "100"
  maxConnectionsPerUser: "50"
  # Disabled by default so a stock chart is reachable. To enable authentication,
  # set this to "true" and provide auth.existingSecret containing users.json.
  authRequired: "false"
  dbPath: "/data/neuralbase"

# TLS configuration.
tls:
  enabled: false
  # Name of existing Secret containing server.crt and server.key.
  existingSecret: ""
  certPath: "/tls/server.crt"
  keyPath: "/tls/server.key"

# User authentication.
auth:
  # Name of existing Secret containing users.json. The Secret is used only as
  # an initial seed; the live registry is copied to the writable data PVC so
  # CREATE/ALTER/DROP USER can persist across restarts.
  existingSecret: ""

# Service configuration.
service:
  type: LoadBalancer
  port: 5432

# Prometheus metrics.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false

# Pod disruption budget. The template derives minAvailable as a strict Raft
# majority: floor(replicaCount / 2) + 1.
podDisruptionBudget:
  enabled: true

# Horizontal scaling is intentionally unavailable for the fixed-membership
# topology. Change replicaCount only together with a deliberate peer-membership
# rollout; do not attach an HPA to this StatefulSet.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Graceful shutdown.
terminationGracePeriodSeconds: 45

# Probes.
startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
