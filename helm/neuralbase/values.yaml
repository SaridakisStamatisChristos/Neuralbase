# NeuralBase Helm values — configurable development/research deployment parameters.

replicaCount: 3

image:
  repository: ghcr.io/saridakisstamatischristos/neuralbase
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

storage:
  size: 10Gi
  storageClassName: ""

config:
  listenAddr: "0.0.0.0:5432"
  raftAddr: "0.0.0.0:7001"
  metricsPort: "9090"
  maxConnections: "500"
  maxConnectionsPerIp: "100"
  maxConnectionsPerUser: "50"
  authRequired: "false"
  dbPath: "/data/neuralbase"

tls:
  # SQL TLS only (requires client TLS); does not configure Raft mTLS.
  enabled: false
  existingSecret: ""
  certPath: "/tls/server.crt"
  keyPath: "/tls/server.key"

# Cluster identity is authoritative in replicated RocksDB state. These settings
# are ONLY for an explicit one-time migration from a legacy strict-SCRAM users.json.
auth:
  # Existing Secret containing key users.json. It is mounted read-only and is
  # never copied into the data PVC as a live per-node registry.
  existingSecret: ""
  # Exact SHA-256 (64 hex characters) of the users.json bytes in existingSecret.
  # existingSecret and migrationSha256 must be supplied together.
  migrationSha256: ""

service:
  type: LoadBalancer
  port: 5432

metrics:
  enabled: true
  serviceMonitor:
    # Reserved value; no ServiceMonitor template is currently emitted.
    enabled: false

podDisruptionBudget:
  enabled: true

# The Raft engine supports explicit membership changes, but this chart does not
# automatically reconcile StatefulSet replica changes through that protocol.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

terminationGracePeriodSeconds: 45

startupProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
