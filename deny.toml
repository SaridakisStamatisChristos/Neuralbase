# SPDX-License-Identifier: Apache-2.0
# cargo-deny configuration — license compliance + advisory checks.
# Run: cargo deny check

[advisories]
version = 2
ignore = [
    # paste crate — transitive via tract-onnx; not directly fixable here.
    # Re-evaluate this exception whenever tract-onnx/dependency versions change.
    "RUSTSEC-2024-0436",
    # rustls-pemfile — unmaintained but functional, no vulnerability.
    # Used only for PEM certificate parsing in src/tls.rs; review on TLS updates.
    "RUSTSEC-2025-0134",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
