# Install in a dedicated namespace. This role is for the explicit external
# controller identity; member pods do not mount service-account credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neuralbase-membership-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "create", "patch"]
